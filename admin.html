<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}

    body{
      display:flex;
      min-height:100vh;
      background:#0f172a;
      color:white;
    }

    /* SIDEBAR */
    .sidebar{
      width:250px;
      background:#111827;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .sidebar h2{
      margin-bottom:20px;
      color:#19e1e8;
    }

    .sidebar a{
      color:white;
      text-decoration:none;
      padding:10px;
      border-radius:8px;
      transition:0.3s;
    }

    .sidebar a:hover{
      background:#19e1e8;
      color:#000;
    }

    /* MAIN */
    .main{
      flex:1;
      padding:20px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:20px;
    }

    .card{
      background:#1f2937;
      padding:20px;
      border-radius:12px;
      text-align:center;
    }

    .card h3{
      margin-bottom:10px;
      color:#19e1e8;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
    }

    table th, table td{
      padding:10px;
      border-bottom:1px solid #333;
      text-align:left;
    }

    .logout{
      background:#ef4444;
      padding:8px 14px;
      border:none;
      color:white;
      border-radius:8px;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="#">Dashboard</a>
    <a href="#">Users</a>
    <a href="#">Registrations</a>
    <a href="#">Feedback</a>
    <a href="#">Settings</a>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">
      <h1>Dashboard</h1>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <!-- CARDS -->
    <div class="cards">
      <div class="card">
        <h3>Total Users</h3>
        <p id="users">0</p>
      </div>
      <div class="card">
        <h3>Registrations</h3>
        <p id="regs">0</p>
      </div>
      <div class="card">
        <h3>Feedback</h3>
        <p id="feedback">0</p>
      </div>
    </div>

    <!-- TABLE -->
    <h2 style="margin-top:30px;">Recent Registrations</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Payment</th>
        </tr>
      </thead>
      <tbody id="regTable">
      </tbody>
    </table>

  </div>

<script>
// Dummy data loader (replace with backend API later)
const data = {
  users: 120,
  regs: 45,
  feedback: 18,
  registrations: [
    {name:"John Doe", email:"john@mail.com", course:"IT", payment:"MTN"},
    {name:"Sarah K", email:"sarah@mail.com", course:"Construction", payment:"Airtel"}
  ]
};

function loadDashboard(){
  document.getElementById("users").innerText = data.users;
  document.getElementById("regs").innerText = data.regs;
  document.getElementById("feedback").innerText = data.feedback;

  const table = document.getElementById("regTable");
  table.innerHTML = "";

  data.registrations.forEach(r => {
    table.innerHTML += `
      <tr>
        <td>${r.name}</td>
        <td>${r.email}</td>
        <td>${r.course}</td>
        <td>${r.payment}</td>
      </tr>
    `;
  });
}

function logout(){
  localStorage.removeItem("admin");
  window.location.href = "login.html";
}

window.onload = loadDashboard;
</script>

</body>
</html>
